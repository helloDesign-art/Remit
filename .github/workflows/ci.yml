name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Relay integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: bash -n relay/remit relay/entrypoint.sh tests/run.sh

      - name: Integration tests
        run: bash tests/run.sh
