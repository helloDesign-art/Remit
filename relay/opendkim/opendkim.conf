# Remit relay — OpenDKIM (signing only)

Syslog                  yes
SyslogSuccess           yes
LogWhy                  yes
UMask                   007
UserID                  opendkim:opendkim
PidFile                 /run/opendkim/opendkim.pid
Socket                  inet:8891@127.0.0.1

# Sign, never verify: nothing comes in from the outside.
Mode                    s
Canonicalization        relaxed/simple
SignatureAlgorithm      rsa-sha256
OversignHeaders         From
AutoRestart             no

# Which messages to sign: anything from an authenticated client or from the
# container itself. Project containers reach us from private addresses.
InternalHosts           /var/lib/remit/opendkim/TrustedHosts
MacroList               auth_type

# Generated by `remit domain add` from the domains in /var/lib/remit/domains.
KeyTable                refile:/var/lib/remit/opendkim/KeyTable
SigningTable            refile:/var/lib/remit/opendkim/SigningTable
